# Configuration nginx du site acdt-solutions.com — repère : acdt-site-conf-v2
#
# Conteneur : service « siteweb » du projet /root/n8n-compose (image nginx:alpine), derrière Traefik
# (Traefik gère HTTPS et www). Ce fichier remplace /etc/nginx/conf.d/default.conf de l'image, monté en
# lecture seule depuis /root/n8n-compose/siteweb/acdt-site.conf. Installation : DEPLOIEMENT.md, étapes A et A2.
#
# Compatible avec l'ancien site (aucun fichier .nginx/ : l'include ne trouve rien) et avec le nouveau.
#
# v2 — journaux : conservation de 7 jours au maximum (politique de confidentialité, section 2.6).
#   Accès : un fichier par jour UTC dans /var/log/acdt-site (volume de l'hôte), au lieu de la sortie standard
#   (journal Docker sans limite de durée). Erreurs : /var/log/acdt-site/error.log.
#   Purge : deploy/journaux/ (timer systemd horaire sur l'hôte).

# Date du jour (UTC) extraite de l'heure de la requête : nom du fichier d'accès.
map $time_iso8601 $acdt_jour {
    "~^(?<jour>\d{4}-\d{2}-\d{2})" $jour;
    default inconnu;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/acdt-site/access-$acdt_jour.log main;
    open_log_file_cache max=4 inactive=5m valid=1m;
    error_log /var/log/acdt-site/error.log warn;

    # Redirections relatives : évite le passage par http:// derrière Traefik.
    absolute_redirect off;
    server_tokens off;

    # Une seule adresse publique : www → domaine principal (Traefik gère HTTPS pour les deux).
    if ($host = www.acdt-solutions.com) {
        return 301 https://acdt-solutions.com$request_uri;
    }

    # Fichiers cachés et internes du dépôt : jamais servis (.git, .github, .DS_Store, .nginx…).
    location ~ /\.(?!well-known/) {
        return 404;
    }
    location = /README.md {
        return 404;
    }

    # Anciennes URL : 301 et 410 générés à chaque publication (src/config/publication.mjs).
    include /usr/share/nginx/html/.nginx/*.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    # Dossier sans page publiée (ex. /solutions/ tant que seule une sous-page l'est) : 404 plutôt que 403.
    error_page 403 =404 /404.html;
    error_page 404 /404.html;
}
