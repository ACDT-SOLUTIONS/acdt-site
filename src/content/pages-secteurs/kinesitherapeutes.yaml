# Sections propres à la page /secteurs/kinesitherapeutes/.
# Cas d'usage issu de la fiche Notion « Prise de rendez-vous téléphonique pour les kinésithérapeutes »,
# au conditionnel tant que le parcours n'a pas été testé de bout en bout sur l'agenda réellement utilisé.
# Avant publication : traiter les points ouverts dans Notion (réservations en attente, numéros fixes ou
# masqués, données de santé dans les journaux et services utilisés). Ne publier ni le nom du cabinet, ni
# celui du praticien, ni sa ville, ni le numéro de sa permanence.

cas:
  eyebrow: Cas d'usage
  titre: Les demandes de rendez-vous pendant les soins.
  blocs:
    - titre: Le besoin
      textes:
        - >-
          Lorsqu'un kinésithérapeute est en séance ou en déplacement à domicile, il ne peut pas toujours répondre
          au téléphone. Certains souhaitent conserver leur agenda habituel et décider eux-mêmes des rendez-vous à
          accepter.
    - titre: Le fonctionnement envisagé
      textes:
        - >-
          Une permanence téléphonique peut recueillir la demande et consulter les disponibilités de l'agenda, sous
          réserve que l'intégration soit validée avec les outils du praticien. Pour un créneau nécessitant son
          accord, une demande lui est transmise. Le patient n'est informé d'une réservation qu'après confirmation
          effective dans l'agenda.
    - titre: Pour qui
      textes:
        - >-
          Cette organisation peut intéresser les praticiens qui n'utilisent pas encore de plateforme de
          réservation ou qui effectuent des visites à domicile. Le périmètre, les données recueillies,
          l'hébergement et les prestataires sont à cadrer avant toute mise en service.

exigences:
  eyebrow: Les exigences de votre cabinet
  titre: Votre pratique a ses exigences. La permanence s'y adapte.
  lead: >-
    Une permanence utile doit respecter vos patients, votre agenda et votre façon de travailler. Ces points
    sont cadrés avec vous avant la mise en service.
  items:
    - titre: La décision reste au praticien
      texte: >-
        Vous définissez les créneaux que la permanence peut proposer seule et ceux qui nécessitent votre
        accord. Pour ces derniers, une demande vous est transmise ; le patient n'est informé qu'après
        confirmation effective dans l'agenda.
    - titre: Votre agenda reste la référence
      texte: >-
        La permanence peut consulter et alimenter l'agenda que vous utilisez déjà, sous réserve que
        l'intégration soit validée avec vos outils.
    - titre: Des données à cadrer avec soin
      texte: >-
        Un appel de patient peut contenir des informations sur sa santé. Les données recueillies, leur
        hébergement, les prestataires utilisés et les durées de conservation sont définis avec vous avant la
        mise en service.
