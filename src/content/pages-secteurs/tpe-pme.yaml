# Sections 03 et 04 — rédaction locale TPE et PME. Hypothèses fictives.
valeur:
  eyebrow: Démontrer la valeur
  titre: Et dans votre entreprise, combien de temps pourriez-vous récupérer ?
  lead: Recopier les demandes reçues ou préparer un reporting mobilise du temps chaque mois. Ajustez ces deux
    scénarios pour estimer ce qu'une automatisation pourrait libérer dans votre équipe.
  simulateur:
    libelleOnglets: Scénario simulé
    sansJs: Le simulateur interactif nécessite JavaScript. L'exemple chiffré ci-dessous reste consultable.
    hypotheses: Vos hypothèses
    avertissement: Ces valeurs sont des hypothèses modifiables, pas des moyennes professionnelles ni des résultats
      clients. La part prise en charge doit tenir compte des vérifications et du suivi qui restent à votre
      équipe.
    reinitialiser: Réinitialiser les hypothèses
    scenarios:
      - id: demandes
        label: Saisie des demandes entrantes
        volume:
          label: Demandes recopiées par mois
          unite: demandes / mois
          valeur: 80
          aide: Comptez uniquement les demandes dont les informations sont recopiées dans vos outils, pas toutes les
            demandes reçues.
        minutes:
          label: Temps moyen de saisie et de mise à jour par demande
          unite: min / demande
          valeur: 5
          aide: Incluez les recopies entre messagerie, tableur et CRM ; excluez le temps de conseil ou de vente.
        part:
          label: Part de ce travail prise en charge
          unite: "%"
          valeur: 60
      - id: reporting
        label: Préparation du reporting
        volume:
          label: Rapports préparés par mois
          unite: rapports / mois
          valeur: 4
          aide: "Exemple : quatre rapports dans le mois. Remplacez ce nombre par votre fréquence réelle."
        minutes:
          label: Temps moyen de préparation par rapport
          unite: min / rapport
          valeur: 90
          aide: Collecte, consolidation et mise en forme des données ; le temps d'analyse et les décisions restent à
            votre équipe.
        part:
          label: Part de ce travail prise en charge
          unite: "%"
          valeur: 70
  resultats:
    titre: Résultats estimés
    libere: Temps potentiellement libéré par mois
    parSemaine: Soit environ {valeur} heures par semaine
    parSemaineSingulier: Soit environ {valeur} heure par semaine
    baseSemaine: Sur la base de 52 semaines pour 12 mois.
    actuel: Temps actuellement consacré
    restant: Temps restant à votre équipe
    incomplet: Renseignez les trois hypothèses pour afficher une estimation.
    invalide: Corrigez les valeurs signalées pour afficher une estimation.
    separe: "Chaque scénario s'explore séparément : leurs résultats ne s'additionnent pas, les deux activités
      pouvant se recouper."
  economie:
    titre: Affiner l'estimation économique
    intro: "Facultatif. Renseignez vos propres valeurs : aucun champ n'est prérempli, et les résultats
      n'apparaissent qu'une fois les paramètres nécessaires saisis."
    champs:
      coutHoraireCharge:
        label: Coût horaire chargé
        unite: € / h
        aide: Coût complet d'une heure de la personne qui réalise aujourd'hui ce travail.
      tauxReaffectation:
        label: Part du temps libéré susceptible d'éviter effectivement une dépense
        unite: "%"
        aide: Heures supplémentaires, renfort ou prestation que vous n'auriez plus à payer.
      coutsRecurrentsMensuels:
        label: Coûts récurrents
        unite: € / mois
        aide: Abonnements, hébergement et maintenance de la solution.
      investissementInitial:
        label: Investissement initial
        unite: €
      horizonMois:
        label: Horizon d'analyse
        unite: mois
    resultats:
      valorisation: Valorisation théorique du temps libéré
      soldeMensuel: Solde mensuel estimé
      soldeCumule: Solde cumulé estimé
      ratio: Solde cumulé rapporté à l'investissement
      delai: Délai de retour estimé
      aucunRetour: Aucun retour sur investissement estimé avec ces hypothèses
      sansInvestissement: Aucun investissement initial à couvrir
    attente:
      valorisation: Renseignez le coût horaire chargé pour afficher la valorisation théorique.
      soldeMensuel: Renseignez la part susceptible d'éviter une dépense et les coûts récurrents pour afficher le
        solde mensuel.
      soldeCumule: Renseignez l'investissement initial et l'horizon d'analyse pour afficher le solde cumulé et le
        délai de retour.
    avertissement: Du temps libéré n'est pas automatiquement une dépense en moins. Sa valorisation est théorique ;
      les économies réellement constatées doivent être vérifiées après mise en service. Cette simulation ne
      prédit ni de nouvelles ventes ni une hausse du chiffre d'affaires.
  exemple:
    simulation: tpe-pme-reporting
    titre: Exemple chiffré — hypothèses fixes
    resume: "{occurrences} rapports par mois × {minutes} minutes, dont {taux} prises en charge : {heures} heures
      potentiellement libérées par mois."
    detail: Voir les autres hypothèses et résultats
    mention: "Scénario fictif indépendant de vos réglages. Les volumes, durées et montants sont des hypothèses :
      ni moyenne professionnelle, ni tarif ACDT, ni résultat client."
    lien: Voir les hypothèses du cas pratique
  conclusion:
    titre: Quelle tâche répétitive aimeriez-vous alléger en premier ?
    cta:
      label: Étudier mon organisation
      href: /rendez-vous/
exigences:
  eyebrow: Une solution à la mesure de votre équipe
  titre: Vos outils. Votre rythme. Une organisation plus simple.
  lead: L'automatisation doit alléger le quotidien de votre équipe, avec un périmètre clair et des résultats que
    vous pouvez suivre.
  items:
    - titre: Partir de vos outils actuels
      texte: Nous regardons d'abord comment relier votre messagerie, vos fichiers et vos logiciels existants. Si un
        changement d'outil est utile, ses avantages, ses limites et son coût sont discutés avec vous.
    - titre: Garder la main sur les décisions
      texte: Vous définissez les règles, les accès et les validations nécessaires. Les offres, les engagements et
        les situations inhabituelles restent sous le contrôle de votre équipe.
    - titre: Commencer par un besoin concret
      texte: Nous choisissons avec vous un processus à améliorer, précisons les coûts de mise en place et les coûts
        récurrents, puis testons le fonctionnement avant de le mettre en service. Les ajustements sont suivis
        dans le périmètre convenu.
