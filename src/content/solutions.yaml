- id: accueil-telephonique-ia
  numero: "01"
  titre: Accueil et permanence téléphonique IA
  accroche: Un assistant peut prendre le relais selon les horaires et les règles définis avec vous.
  description: >-
    Un assistant vocal prend le relais lorsque vous êtes occupé, absent ou hors horaires :
    il identifie le motif de l'appel, prend un message ou un rendez-vous, et prévient la bonne personne.
  capacites:
    - Permanence téléphonique intelligente
    - Qualification des appels
    - Prise de messages et rendez-vous
    - Transferts et notifications
    - Continuité d'accueil
  flux:
    - { etape: Appel entrant, detail: "hors horaires ou ligne occupée" }
    - { etape: Qualification, detail: "motif, urgence, coordonnées" }
    - { etape: Suite donnée, detail: "rendez-vous, message ou transfert" }
  statut: disponible

- id: automatisation-administrative
  numero: "02"
  titre: Automatisation des processus administratifs
  accroche: Les tâches répétitives peuvent avancer selon des règles définies, avec validation humaine aux étapes prévues.
  description: >-
    Nous automatisons les tâches répétitives qui ralentissent vos dossiers : collecte de pièces,
    formulaires, génération de documents, devis, facturation et suivi des échéances.
  capacites:
    - Emails et relances
    - Gestion documentaire
    - Collecte de données
    - Formulaires
    - Devis et facturation
    - Dossiers et échéances
    - Agents IA appliqués aux tâches métier
  flux:
    - { etape: Pièce manquante, detail: "détectée dans le dossier" }
    - { etape: Relance programmée, detail: "jusqu'à réception" }
    - { etape: Dossier à jour, detail: "classement et suivi automatiques" }
  statut: disponible

- id: crm-automatisation-commerciale
  numero: "03"
  titre: CRM et automatisation commerciale
  accroche: Centralisez les demandes et rendez leur suivi plus lisible.
  description: >-
    Vos demandes entrantes sont centralisées, qualifiées et suivies jusqu'à la signature,
    avec des relances au bon moment et des tableaux de bord qui se mettent à jour seuls.
  capacites:
    - Gestion des prospects
    - Qualification des demandes
    - Synchronisation CRM
    - Relances commerciales
    - Reporting et tableaux de bord
  flux:
    - { etape: Nouvelle demande, detail: "site, email ou téléphone" }
    - { etape: Fiche CRM, detail: "qualifiée et attribuée" }
    - { etape: Relance et suivi, detail: "jusqu'à la décision" }
  statut: disponible

- id: infrastructure-privee
  numero: "04"
  titre: Infrastructure privée et automatisations sécurisées
  accroche: Vos données restent dans un périmètre défini avec vous.
  description: >-
    Certaines automatisations peuvent être hébergées sur un serveur local ou une infrastructure dédiée.
    Le choix dépend des outils, des données, des accès nécessaires et des obligations applicables. Une IA
    exécutée localement peut être étudiée lorsque le cas d'usage s'y prête.
  capacites:
    - Serveurs locaux
    - Automatisations hébergées sur infrastructure adaptée
    - IA locale lorsque pertinente
    - Sauvegardes et contrôle des accès
  flux:
    - { etape: Données sensibles, detail: "périmètre défini avec vous" }
    - { etape: Traitement maîtrisé, detail: "infrastructure dédiée" }
    - { etape: Accès contrôlés, detail: "sauvegardes et journalisation" }
  statut: sous-reserve
  mention: >-
    Solutions adaptées aux exigences de confidentialité, proposées sous réserve de validation
    technique et réglementaire de chaque projet.
  metiersComplementaires:
    - nom: Cabinets d'expertise comptable
      texte: >-
        Organiser les pièces comptables, les dossiers clients et les échanges internes dans un environnement
        maîtrisé, avec des accès adaptés à chaque collaborateur. Les logiciels de production réglementés
        et les plateformes soumises à un agrément ne sont pas concernés.
    - nom: Cabinets de recrutement et services RH
      texte: >-
        Classer les candidatures, préparer les documents internes et organiser les accès aux dossiers RH,
        sur les seules données nécessaires au suivi. Les usages portant sur des données de santé sont exclus.
    - nom: Architectes et bureaux d'études
      texte: >-
        Centraliser les plans, les contrats et les documents de projet, puis automatiser leur classement
        et leur suivi. Les projets classifiés ou imposant une habilitation spécifique sont exclus.
    - nom: Cabinets de conseil et d'audit
      texte: >-
        Préserver la confidentialité des dossiers de mission, analyses et documents stratégiques avec des
        outils internes et des échanges contrôlés. Le périmètre porte sur l'organisation documentaire,
        sans intervention sur les systèmes soumis à une certification ou à un agrément spécifiques.
    - nom: Bureaux de recherche et développement
      texte: >-
        Organiser les documents techniques, prototypes et connaissances internes sans les transmettre
        systématiquement à des services externes. Les activités de défense, données classifiées et
        environnements exigeant une habilitation spécifique sont hors périmètre.
  metiersNote: >-
    Ces exemples concernent des outils internes et des automatisations sur un périmètre défini avec vous.
    Nous vérifions les exigences de chaque mission avant de la proposer. Les prestations nécessitant un
    agrément, une habilitation ou une certification spécifiques non détenus par ACDT sont exclues,
    notamment l'hébergement de données de santé soumis à certification HDS. Une installation locale
    ne dispense pas de vérifier les obligations applicables.
